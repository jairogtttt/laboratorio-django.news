<div class="card shadow-sm border-0 mb-4 h-100">
    {% if article.image %}
        <img src="{{ article.image.url }}" class="card-img-top" alt="{{ article.title }}" style="height: 220px; object-fit: cover;">
    {% endif %}
    <div class="card-body">
        <div class="mb-2">
            {% for cat in article.categories.all %}
                <span class="badge bg-primary me-1">{{ cat.name }}</span>
            {% endfor %}
        </div>
        <h5 class="card-title fw-bold">
            <a href="{% url 'news:article_detail' article.slug %}" class="text-decoration-none text-dark">
                {{ article.title }}
            </a>
        </h5>
        <p class="card-text text-secondary">{{ article.summary|truncatechars:90 }}</p>
    </div>
    <div class="card-footer bg-white border-0 d-flex justify-content-between align-items-center pb-3">
        <small class="text-muted">Por {{ article.author.name }} • {{ article.published_at|date:"d/m/Y H:i" }}</small>
        <a href="{% url 'news:article_detail' article.slug %}" class="btn btn-outline-primary btn-sm">Leer más</a>
    </div>
</div>
