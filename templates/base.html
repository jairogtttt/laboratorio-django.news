{% load static %}
<!DOCTYPE html>
<html lang='es'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>{% block title %}Portal de Noticias{% endblock %}</title>
    <link href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css' rel='stylesheet'>
</head>
<body class='bg-light d-flex flex-column min-vh-100'>
    <nav class='navbar navbar-expand-lg navbar-dark bg-dark shadow-sm mb-4'>
        <div class='container'>
            <a class='navbar-brand fw-bold text-warning' href='{% url "news:home" %}'>📰 NOTICIAS C24</a>
            <a class='btn btn-outline-light btn-sm' href='/admin/' target='_blank'>Panel Admin</a>
        </div>
    </nav>
    <div class='container flex-grow-1'>
        {% block content %}{% endblock %}
    </div>
</body>
</html>
