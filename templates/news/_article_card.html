<div class='card shadow-sm border-0 mb-4 h-100'>
    <div class='card-body'>
        <h5 class='card-title fw-bold'>
            <a href='{% url "news:article_detail" article.slug %}' class='text-decoration-none text-dark'>
                {{ article.title }}
            </a>
        </h5>
        <p class='card-text text-secondary'>{{ article.summary|truncatechars:90 }}</p>
    </div>
</div>
